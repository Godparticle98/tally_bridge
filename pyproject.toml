[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tally_bridge"
authors = [
    { name = "Manoj Seenivasan", email = "info@mj.com"}
]
description = "ERPNext to Tally Prime XML Export & Sync"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "xmltodict",
    "requests",
]

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0"
